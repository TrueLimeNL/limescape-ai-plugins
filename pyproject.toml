[project]
name = "limescape-ai-plugins"
# The bundle version is the git tag (v1.4.2 -> 1.4.2); this field is unused.
version = "0.0.0"
description = "Node types for the Limescape AI Platform, loaded dynamically at runtime"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
    # Exact pin: bundle.lock is resolved with this SDK version.
    "limescape-plugin-sdk==0.2.0",
    "pytest>=8.3",
    "pytest-asyncio>=1.3",
    "ruff>=0.6",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "pip-licenses>=5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["src/node-types"]
# Every node type has tests/test_node.py; importlib mode keeps them apart.
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
explicit_package_bases = true

[tool.bandit]
exclude_dirs = ["tests"]

# Legacy snapshot of the builtin node type 'limescape_docs' (platform 1.62.5).
# Generated by scripts/plugins/dump_legacy_manifests.py. Do not edit:
# this is the compatibility baseline for a plugin with the same code.
schema_version: 1
code: limescape_docs
name: Limescape docs
description: Convert document URLs through direct LimeScape Docs package calls.
category: documents
icon:
  static: /static/images/web/limescape-small-trans.png
availability: general
stage: stable
runtime:
  execution_mode: stream
  trace: decorator
  manages_output_keys: false
  isolation: shared
  timeout_seconds: 300
capabilities: []
dependencies: []
io:
  input_data: {}
  output_data:
    docs_result: Converted document result from Limescape docs server
form:
  fields:
  - name: urls
    type: text
    label: URL(s)
    description: Gebruik een directe URL of een expressie zoals {{ file }}. Dit mag ook een expressie
      zijn die resolveert naar een lijst met URLs.
    default: ''
    required: 0
    max_length: 350
  - name: input_keys
    type: text
    label: Input label(s) for URL or URL list (comma-separated)
    description: 'Naam van het input veld in input_data dat de URL of URL-lijst bevat (standaard: file).'
    default: file
    required: 0
    max_length: 350
  - name: output_key
    type: text
    label: Output label
    description: Naam van het output veld waarin het conversieresultaat wordt opgeslagen.
    default: docs_result
    required: 0
    max_length: 350
  - name: source_auth_mode
    type: select
    label: Source auth mode
    description: Kies hoe Limescape Docs een beschermde bron-URL moet authenticeren. Op basis van deze
      keuze wordt het juiste invoerveld zichtbaar.
    default: none
    required: 0
    choices:
    - name: None
      value: none
    - name: Bearer token uit flow-parameter
      value: bearer
    - name: Bearer token via Django admin credential
      value: bearer_credential
  - name: source_auth_token
    type: password
    label: Source auth token
    description: Token voor bron-authenticatie. Ondersteunt runtime-expressies zoals {{ tribe_token }}
      zodat je een flow-parameter als token kunt gebruiken.
    default: ''
    required: 0
    max_length: 4000
    depends_on:
      visible_when:
        field_name: source_auth_mode
        field_value: bearer
  - name: source_auth_credential_code
    type: select
    label: Source auth credential
    description: Selecteer een Tribe credential uit Django admin als alternatief voor een runtime token-parameter.
      Zowel Tribe OAuth2 als Tribe bearer credentials worden ondersteund.
    default: ''
    required: 0
    depends_on:
      visible_when:
        field_name: source_auth_mode
        field_value: bearer_credential
    lookup:
      app_label: credentials
      model_name: Credential
      filter_operator: and
      filter:
        team: current_team_id
        is_active: true
        user__isnull: true
        credential_type__name__in:
        - tribeCrmOAuth2Api
        - tribeCrmBearerTokenApi
      field_value: code
      field_display: name
    choices: []
  - name: ai_provider_and_model
    type: select
    label: AI provider and model
    description: Kies een model uit de standaard model lookup. Niet-ondersteunde keuzes geven runtime
      een fout in deze skill.
    default: gemini-2.5-pro
    required: 0
    lookup:
      app_label: ai_platform_shared
      model_name: LookupListItem
      filter:
        lkuplitm_cat: ai_provider_and_model
      field_value: lkuplitm_value
      field_display: lkuplitm_display_name
    choices: []
  - name: json_schema
    type: json
    label: JSON schema (object or JSON string)
    description: Schema voor structured extraction; laat leeg voor alleen OCR/markdown output.
    default: "{\n  \"title\": \"DocumentExtraction\",\n  \"type\": \"object\",\n  \"properties\": {\n\
      \    \"pages\": {\n      \"type\": \"array\",\n      \"description\": \"List of pages extracted\
      \ from the document.\",\n      \"items\": {\n        \"type\": \"object\",\n        \"properties\"\
      : {\n          \"page_number\": {\n            \"type\": \"integer\",\n            \"description\"\
      : \"The sequential number of the page.\"\n          },\n          \"zones\": {\n            \"type\"\
      : \"array\",\n            \"description\": \"List of distinct spatial zones (text blocks, tables,\
      \ or images) found on this page.\",\n            \"items\": {\n              \"type\": \"object\"\
      ,\n              \"properties\": {\n                \"type\": {\n                  \"type\": \"\
      string\",\n                  \"enum\": [\n                    \"text_block\",\n                \
      \    \"table\",\n                    \"image\",\n                    \"handwriting\",\n        \
      \            \"header\",\n                    \"footer\"\n                  ],\n               \
      \   \"description\": \"The classification of the content in this zone.\"\n                },\n \
      \               \"content_verbatim\": {\n                  \"type\": \"string\",\n             \
      \     \"description\": \"For text/tables: The exact text found in this zone, preserving newlines\
      \ and spacing. For images: null.\"\n                },\n                \"image_description\": {\n\
      \                  \"type\": \"string\",\n                  \"description\": \"For images: A detailed\
      \ visual description of the image content. For text: null.\"\n                },\n             \
      \   \"position\": {\n                  \"type\": \"string\",\n                  \"enum\": [\n  \
      \                  \"top_left\",\n                    \"top_center\",\n                    \"top_right\"\
      ,\n                    \"middle_left\",\n                    \"center\",\n                    \"\
      middle_right\",\n                    \"bottom_left\",\n                    \"bottom_center\",\n\
      \                    \"bottom_right\"\n                  ],\n                  \"description\":\
      \ \"The approximate spatial location of this zone on the page.\"\n                },\n         \
      \       \"confidence_score\": {\n                  \"type\": \"number\",\n                  \"description\"\
      : \"A score between 0 and 1 indicating how confident the model is in the extraction.\"\n       \
      \         }\n              },\n              \"required\": [\n                \"type\",\n      \
      \          \"content_verbatim\",\n                \"position\"\n              ]\n            }\n\
      \          }\n        },\n        \"required\": [\n          \"page_number\",\n          \"zones\"\
      \n        ]\n      }\n    },\n    \"document_summary\": {\n      \"type\": \"string\",\n      \"\
      description\": \"A brief 2-3 sentence summary of what this entire document represents.\"\n    }\n\
      \  },\n  \"required\": [\n    \"pages\",\n    \"document_summary\"\n  ]\n}"
    required: 0
  - name: extract_only
    type: checkbox
    label: Extract only
    description: Sla OCR markdown-opbouw over en voer alleen structured extraction uit. JSON schema is
      vereist voor deze optie.
    default: false
    required: 0
  - name: classic_extraction_only
    type: checkbox
    label: Classic extraction only
    description: Gebruik alleen de bestaande tekstlaag van PDF/Office-documenten en sla pagina-afbeeldingen/OCR
      over.
    default: false
    required: 0
  - name: dynamic_pdf_processing
    type: select
    label: Per-pagina vision-afweging
    description: 'Bepaalt per pagina of de bestaande tekstlaag wordt gebruikt of vision-OCR. Auto: automatisch
      kiezen (standaard; tekstpagina''s goedkoop, scans/foto''s via vision). Aan: forceer de per-pagina
      afweging. Uit: forceer vision-OCR op elke pagina (bijv. om afbeeldingen overal te laten beschrijven).
      Heeft geen effect wanneer ''Classic extraction only'' aanstaat.'
    default: auto
    required: 0
    choices:
    - name: Automatisch (standaard)
      value: auto
    - name: Aan (per-pagina afweging)
      value: 'on'
    - name: Uit (altijd vision-OCR)
      value: 'off'
  - name: extract_page_by_page
    type: checkbox
    label: Extract page by page
    description: Voer structured extraction per pagina uit in plaats van op het volledige document.
    default: true
    required: 0
  - name: enable_hybrid_extraction
    type: checkbox
    label: Enable hybrid extraction
    description: Gebruik hybride structured extraction waarbij pagina-afbeeldingen direct gebruikt worden
      naast documentcontext.
    default: false
    required: 0
  - name: maintain_format
    type: checkbox
    label: Maintain format
    description: Behoud opmaak en context tussen pagina's tijdens OCR verwerking.
    default: false
    required: 0
  - name: correct_orientation
    type: checkbox
    label: Correct orientation
    description: Corrigeer automatisch rotatie/oriëntatie van pagina-afbeeldingen.
    default: true
    required: 0
  - name: trim_edges
    type: checkbox
    label: Trim edges
    description: Snijd randen weg bij afbeeldingverwerking voor betere OCR-kwaliteit.
    default: true
    required: 0
  - name: image_density
    type: integer
    label: Image density
    description: DPI-resolutie voor PDF-naar-image rendering (hoger = scherper, trager).
    default: 150
    required: 0
  - name: image_height
    type: integer
    label: Image height
    description: Doelhoogte in pixels voor pagina-afbeeldingen tijdens preprocessing.
    default: 1800
    required: 0
  - name: image_format
    type: select
    label: Image format
    description: Afbeeldingsformaat dat gebruikt wordt in verwerking (png of jpeg).
    default: png
    required: 0
    choices:
    - name: png
      value: png
    - name: jpeg
      value: jpeg
  - name: pages_to_convert
    type: text
    label: Pages to convert (int or JSON list, e.g. 1 or [1,2,3])
    description: Specificeer welke pagina's verwerkt worden (bijv. 1 of [1,2,3]). Laat leeg om alle pagina's
      te converteren.
    default: ''
    required: 0
    max_length: 500
  - name: max_retries
    type: integer
    label: Max retries
    description: Aantal retries per pagina wanneer OCR/extractie tijdelijk faalt.
    default: 1
    required: 0
  - name: prompt_id
    type: select
    multi_select: false
    label: OCR prompt
    description: Selecteer een prompt uit promptbeheer voor OCR tekstextractie.
    default: ''
    required: 0
    lookup:
      app_label: prompt_manager
      model_name: Prompt
      filter_operator: or
      filter:
        team: current_team_id
        team_id: 'null'
      field_value: prompt_id
      field_display: prompt_name
    quick_link_enabled: true
    choices: []
  - name: extraction_prompt_id
    type: select
    multi_select: false
    label: Extraction prompt
    description: Selecteer een prompt uit promptbeheer voor structured extraction.
    default: ''
    required: 0
    lookup:
      app_label: prompt_manager
      model_name: Prompt
      filter_operator: or
      filter:
        team: current_team_id
        team_id: 'null'
      field_value: prompt_id
      field_display: prompt_name
    quick_link_enabled: true
    choices: []
  - name: llm_params
    type: json
    label: LLM params JSON
    description: JSON met modelparameters zoals temperature, max_tokens en top_p.
    default: "{\n  \"temperature\": 0.1,\n  \"max_tokens\": 16000,\n  \"top_p\": 0.9,\n  \"frequency_penalty\"\
      : 0.0,\n  \"presence_penalty\": 0.0\n}"
    required: 0
  - name: use_liteparse
    type: checkbox
    label: Use LiteParse backend
    description: Gebruik LiteParse als parsing backend voor betere OCR confidence scoring. Vereist dat
      liteparse geïnstalleerd is op de docs server (limescape-docs[liteparse]).
    default: false
    required: 0
  - name: liteparse_ocr_server_url
    type: text
    label: LiteParse OCR server URL
    description: URL van de externe OCR server voor LiteParse (optioneel). Laat leeg om de standaard ingebouwde
      OCR te gebruiken.
    default: ''
    required: 0
    max_length: 500
  - name: liteparse_ocr_warmup_url
    type: text
    label: LiteParse OCR warmup URL
    description: Optioneel endpoint om de externe OCR server vooraf te pingen. Laat leeg om de LiteParse
      OCR server URL te gebruiken.
    default: ''
    required: 0
    max_length: 500
  - name: liteparse_ocr_language
    type: select
    label: LiteParse OCR language
    description: Taal die LiteParse gebruikt voor OCR verwerking.
    default: eng
    required: 0
    choices:
    - name: English (Engels)
      value: eng
    - name: Dutch (Nederlands)
      value: nld
    - name: French (Frans)
      value: fra
    - name: German (Duits)
      value: deu
  layout:
  - id: tab-settings
    sections:
    - id: section-properties
      fields:
      - urls
      - input_keys
      - output_key
      - source_auth_mode
      - source_auth_token
      - source_auth_credential_code
  - id: tab-advanced
    sections:
    - id: section-properties
      fields:
      - ai_provider_and_model
      - extract_only
      - classic_extraction_only
      - dynamic_pdf_processing
      - json_schema
      - extract_page_by_page
      - enable_hybrid_extraction
      - maintain_format
      - correct_orientation
      - trim_edges
      - image_density
      - image_height
      - image_format
      - pages_to_convert
      - max_retries
      - prompt_id
      - extraction_prompt_id
      - llm_params
      - use_liteparse
      - liteparse_ocr_server_url
      - liteparse_ocr_warmup_url
      - liteparse_ocr_language

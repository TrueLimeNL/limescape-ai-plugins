# Legacy snapshot of the builtin node type 'sharepoint_excel_query' (platform 1.62.5).
# Generated by scripts/plugins/dump_legacy_manifests.py. Do not edit:
# this is the compatibility baseline for a plugin with the same code.
schema_version: 1
code: sharepoint_excel_query
name: Consult Excel document
description: Download an Excel file from SharePoint or a direct URL such as an Azure Blob SAS URL and
  return matching rows as JSON.
category: documents
icon:
  static: /static/assets/media/file-types/excel.svg
availability: general
stage: stable
runtime:
  execution_mode: stream
  trace: none
  manages_output_keys: false
  isolation: shared
  timeout_seconds: 300
capabilities: []
dependencies: []
io:
  input_data:
    team_id: Team context used to resolve the selected Django-admin credential.
  output_data:
    excelMatches: JSON object containing all matching rows from the selected Excel sheet or sheets.
form:
  fields:
  - name: credential_code
    type: select
    label: Microsoft Credential
    required: 0
    default: ''
    lookup:
      app_label: credentials
      model_name: Credential
      filter_operator: and
      filter:
        team: current_team_id
        is_active: true
        user__isnull: true
        credential_type__name__in:
        - microsoftOAuth2Api
        - microsoftOutlookOAuth2Api
        - microsoftGraphClientCredentialsApi
      field_value: code
      field_display: name
    help_text: Required for SharePoint URLs. Supports Microsoft OAuth2 and Microsoft Graph client-credentials.
      Leave empty for direct Excel URLs such as Azure Blob SAS links.
    choices: []
  - name: file_url
    type: text
    label: Excel file URL
    required: 1
    default: ''
    max_length: 2000
    help_text: Provide a SharePoint sharing URL or a direct Excel URL such as an Azure Blob SAS link.
  - name: sheet_name
    type: text
    label: Sheet name
    required: 1
    default: ''
    max_length: 255
    help_text: Worksheet name to query. Use a single sheet name, a comma-separated list, or a JSON array
      of sheet names.
  - name: match_values
    type: json
    label: Match values
    required: 1
    default: "{\n  \"E-maildomeinen\": \"{{ email_domain }}\",\n  \"Locatie\": \"{{ location }}\",\n \
      \ \"Schadeobject\": \"{{ damage_object }}\"\n}"
    help_text: JSON object with column names as keys and the values to match after trim normalization.
      Use a JSON array for OR values within one column, for example ["Utrecht", "Rotterdam"]. Use exact
      values by default, or use % as a wildcard, for example "%{{ domein }}%". Use "*" as the column name
      to match the value against any column in the sheet.
  - name: ignore_case
    type: checkbox
    label: Ignore case
    required: 0
    default: true
    help_text: Match cell values case-insensitively. Disable this for exact case-sensitive matching.
  - name: output_key
    type: text
    label: Output Key
    required: 0
    default: excelMatches
    max_length: 120
  layout:
  - id: tab-settings
    sections:
    - id: section-properties
      fields:
      - credential_code
      - file_url
      - sheet_name
      - match_values
      - ignore_case
      - output_key

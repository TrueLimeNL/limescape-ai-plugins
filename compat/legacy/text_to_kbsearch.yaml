# Legacy snapshot of the builtin node type 'text_to_kbsearch' (platform 1.62.5).
# Generated by scripts/plugins/dump_legacy_manifests.py. Do not edit:
# this is the compatibility baseline for a plugin with the same code.
schema_version: 1
code: text_to_kbsearch
name: Search text in knowledge base
description: query search on knowledge base
category: knowledge
icon:
  lucide: search
availability: general
stage: stable
runtime:
  execution_mode: stream
  trace: llm
  manages_output_keys: false
  isolation: shared
  timeout_seconds: 300
capabilities: []
dependencies: []
io:
  input_data: {}
  output_data:
    search_results: the search results based on the input text and prompt
form:
  fields:
  - name: knowledge_sources
    type: select
    multi_select: true
    label: Knowledge sources
    lookup:
      app_label: knowledge_source_manager
      model_name: KnowledgeSource
      filter:
        team: current_team_id
      field_value: ksrc_id
      field_display: ksrc_name
    quick_link_enabled: true
    choices: []
  - name: enable_keyword_generation
    type: checkbox
    depends_on:
      visible_when:
        field_name: search_query_type
        field_value: keyword
    default: false
    label: Vraag omzetten naar zoekwoorden
    required: 0
  - name: keyword_generation_prompt_id
    type: select
    multi_select: false
    label: Keyword generation prompt
    required: 0
    depends_on:
      visible_when:
        field_name: enable_keyword_generation
        field_value: true
    default: ''
    lookup:
      app_label: prompt_manager
      model_name: Prompt
      filter_operator: or
      filter:
        team: current_team_id
        team_id: 'null'
      field_value: prompt_id
      field_display: prompt_name
    quick_link_enabled: true
    choices: []
  - name: search_query_type
    type: select
    label: Search type
    choices:
    - name: Vector
      value: vector
    - name: Keyword
      value: keyword
    - name: Hybrid
      value: hybrid
    - name: Semantic
      value: semantic
    default: semantic
  - name: enable_caching
    type: checkbox
    default: true
    label: Cache zoek resultaten
    required: 0
  - name: semantic_configuration_name
    type: text
    label: Semantic Configuration
    description: "\n                    Specificeert de naam van een semantische configuratie die gedefinieerd\
      \ is in je Azure Search-dienst.\n                    Een semantische configuratie is een sectie\
      \ in je index die veldinvoer vastlegt voor semantische rangschikking.\n                    Je kunt\
      \ op elk moment een semantische configuratie toevoegen of bijwerken.\n                    Als je\
      \ meerdere configuraties maakt, kun je een standaard opgeven.\n                    Geef tijdens\
      \ een query een semantische configuratie op bij een queryverzoek of laat het leeg om de standaard\
      \ te gebruiken.\n                    <br><br>\n                    Meer info: <br>\n           \
      \         - <a href=\"https://learn.microsoft.com/en-us/azure/search/semantic-search-overview\"\
      \ target=\"_blank\">Semantic Configuration</a><br>\n                    "
    default: default
    depends_on:
      visible_when:
        field_name: search_query_type
        field_value: semantic
    required: 0
  - name: search_query
    type: text
    label: Search query
    description: Gebruik een directe query of een expressie zoals {{ text }}. Laat leeg om de bestaande
      input key-configuratie te blijven gebruiken.
    default: ''
    required: 0
    max_length: 350
  - name: knowledge_source_input
    type: text
    label: Kennisbronnen vanuit input meegeven
    description: Gebruik een variabele-expressie zoals {{ knowledge_source_ids }}. Deze moet resulteren
      in een array van knowledge source ids. Laat leeg om alleen de statische knowledge sources te gebruiken.
    default: ''
    required: 0
    max_length: 350
  - name: replace_knowledge_sources
    type: checkbox
    label: Vervang de geselecteerde kennisbronnen (indien er kennisbronnen via input worden meegegeven)
    default: true
    required: 0
  - name: input_keys
    type: text
    label: 'Welke input key moet gebruikt worden om de knowledge base te doorzoeken:'
    default: text
    required: 0
    max_length: 350
  - name: output_key
    type: text
    label: 'Label de uitvoer van deze vaardigheid alsvolgt:'
    default: search_results
    required: 0
    max_length: 350
  - name: select
    type: text
    depends_on:
      visible_when:
        field_name: search_query_type
        field_value: keyword,hybrid,semantic,vector
    label: Velden om te selecteren in de zoekresultaten.
    description: "\n                    Specificeert welke velden moeten worden opgenomen in de zoekresultaten.\
      \ <br>\n                    Gebruik een door komma's gescheiden lijst van veldpaden, of '*' voor\
      \ alle opvraagbare velden.\n                    "
    default: url,name,timestamp,metadata,doc_id,parent_id,description,chunk,knowledge_source
    required: 0
    max_length: 350
  - name: highlight_pre_tag
    type: text
    label: Highlight pre tag
    description: "\n                    HTML of tekst die vóór de highlight wordt ingevoegd. Laat leeg\
      \ voor standaardgedrag.\n                    "
    default: ''
    required: 0
    max_length: 120
  - name: highlight_post_tag
    type: text
    label: Highlight post tag
    description: "\n                    HTML of tekst die na de highlight wordt ingevoegd. Laat leeg voor\
      \ standaardgedrag.\n                    "
    default: ''
    required: 0
    max_length: 120
  - name: highlight_chunks
    type: text
    label: Highlight field
    description: "\n                    Het documentveld dat door Azure Search gebruikt wordt voor highlight\
      \ snippets. Leeg laten resulteert in het veld 'chunk'.\n                    "
    default: chunk
    required: 0
    max_length: 120
  - name: minimum_relevancy_score
    depends_on:
      visible_when:
        field_name: search_query_type
        field_value: vector,keyword,hybrid,semantic
    type: float
    label: Minimum Relevancy Score
    description: "\n                    Minimale relevantiescore die een zoekresultaat moet hebben om\
      \ te worden opgenomen.\n                    De scores worden door Azure Search berekend (hoger is\
      \ relevanter).\n                    <br><br>\n\n                    <strong>Keyword Search (BM25):</strong><br>\n\
      \                    Gebruikt het BM25-algoritme.\n                    De score heeft geen vaste\
      \ bovengrens; een hogere score betekent hogere relevantie. <br>\n                    Meer info:\
      \ <a href=\"https://learn.microsoft.com/en-us/azure/search/index-similarity-and-scoring\" target=\"\
      _blank\">Keyword Scoring (BM25)</a> <br><br>\n\n                    <strong>Vector Search (HNSW/Exhaustive\
      \ KNN):</strong><br>\n                    Scores variëren per metriek: Cosine (0.333 - 1.00), Euclidean/DotProduct\
      \ (0 - 1.00). <br>\n                    De weergegeven @search.score is een getransformeerde waarde\
      \ (1 / (1 + cosine_distance)) voor ranking; hogere waarden zijn beter.<br>\n                   \
      \ Meer info: <a href=\"https://learn.microsoft.com/en-us/azure/search/vector-search-ranking\" target=\"\
      _blank\">Vector Scoring</a> <br><br>\n\n                    <strong>Hybrid Search (RRF):</strong><br>\n\
      \                    Combineert resultaten van meerdere zoekmethoden (bv. keyword en vector) via\
      \ Reciprocal Rank Fusion (RRF). <br>\n                    De RRF-score (@search.score) wordt berekend\
      \ als 1/(rank + k) per document per resultaatlijst, en vervolgens gesommeerd. <br>\n           \
      \         De bovengrens hangt af van het aantal gefuseerde queries.<br>\n                    Meer\
      \ info: <a href=\"https://learn.microsoft.com/en-us/azure/search/hybrid-search-ranking\" target=\"\
      _blank\">Hybrid Scoring (RRF)</a> <br><br>\n\n                    <strong>Semantic Ranking:</strong><br>\n\
      \                    Past een secundaire ranking toe op BM25 of RRF resultaten met deep learning\
      \ modellen. <br>\n                    De @search.rerankerScore varieert van 0 (0.00) tot 100 (4.00),\
      \ waarbij een hogere score duidt op hogere semantische relevantie.<br>\n                    Meer\
      \ info: <a href=\"https://learn.microsoft.com/en-us/azure/search/semantic-search-overview\" target=\"\
      _blank\">Semantic Scoring</a> <br><br>\n                    "
    default: 0.0
    required: 0
  - name: query_type
    type: select
    depends_on:
      visible_when:
        field_name: search_query_type
        field_value: keyword,hybrid,semantic
    label: Query type
    description: "\n                    Specificeert de syntaxis van de zoekopdracht. De standaardwaarde\
      \ is 'simple'.\n                    Gebruik 'Full' als uw query de Lucene query syntax gebruikt\
      \ en 'semantic' als query syntax niet nodig is.\n                    <br><br>\n\n              \
      \      <strong>Simple</strong>: <br>\n                    Gebruikt de eenvoudige querysyntaxis voor\
      \ zoekopdrachten.\n                    Zoektekst wordt geïnterpreteerd met behulp van een eenvoudige\
      \ querytaal waarmee symbolen zoals +, * en '' kunnen worden gebruikt.\n                    Query's\
      \ worden standaard geëvalueerd in alle doorzoekbare velden, tenzij de parameter searchFields is\
      \ opgegeven.\n                    <br><br>\n\n                    <strong>Full</strong>: <br>\n\
      \                    Gebruikt de volledige Lucene-querysyntaxis voor zoekopdrachten.\n         \
      \           Zoektekst wordt geïnterpreteerd met behulp van de Lucene-querytaal waarmee veldspecifieke\
      \ en gewogen zoekopdrachten, evenals andere geavanceerde functies mogelijk zijn.\n             \
      \       <br><br>\n\n                    <strong>Semantic</strong>: <br>\n                    Het\
      \ meest geschikt voor query's die in natuurlijke taal worden uitgedrukt in plaats van trefwoorden.\n\
      \                    Verbetert de nauwkeurigheid van zoekresultaten door de bovenste zoekresultaten\
      \ opnieuw te rangschikken met behulp van een classificatiemodel dat is getraind op het web-corpus.\n\
      \                    <br><br>\n\n                    Meer info: <br>\n                    - <a href=\"\
      https://learn.microsoft.com/en-us/azure/search/query-simple-syntax\" target=\"_blank\">Simple Query\
      \ Syntax</a> <br>\n                    - <a href=\"https://learn.microsoft.com/en-us/azure/search/query-lucene-syntax\"\
      \ target=\"_blank\">Lucene Query Syntax</a> <br>\n                    - <a href=\"https://learn.microsoft.com/nl-nl/rest/api/searchservice/documents/search-post?view=rest-searchservice-2025-05-01-preview&tabs=HTTP#QueryType\"\
      \ target=\"_blank\">Query Type</a>\n                    "
    choices:
    - name: Simple
      value: simple
    - name: Full
      value: full
    - name: Semantic
      value: semantic
    default: full
    required: 0
  - name: search_mode
    type: select
    depends_on:
      visible_when:
        field_name: search_query_type
        field_value: keyword,hybrid,semantic
    label: Search Mode
    description: "\n                    Een waarde die aangeeft of een of alle zoektermen moeten worden\
      \ vergeleken om het document als overeenkomst te tellen.\n                    De parameter searchMode\
      \ bepaalt de precisie en de terugval.\n                    Als je meer recall wilt, gebruik dan\
      \ de standaardwaarde 'any', die een resultaat geeft als een deel van de querystring wordt gevonden.\n\
      \                    Als u de voorkeur geeft aan precisie, waarbij alle delen van de tekenreeks\
      \ moeten worden gevonden, wijzigt u de zoekmodus in 'all'.\n                    Geldige waarden\
      \ zijn 'any' of 'all' De standaardwaarde is 'any'.\n                    <br><br>\n\n           \
      \         <strong>Any</strong>: <br>\n                    Een van de zoektermen moet worden vergeleken\
      \ om het document als overeenkomst te tellen.\n                    <br><br>\n\n                \
      \    <strong>All</strong>: <br>\n                    Alle zoektermen moeten worden vergeleken om\
      \ het document als overeenkomst te tellen.\n                    <br><br>\n\n                   \
      \ Meer info: <br>\n                    - <a href=\"https://learn.microsoft.com/nl-nl/rest/api/searchservice/documents/search-post?view=rest-searchservice-2025-05-01-preview&tabs=HTTP#searchmode\"\
      \ target=\"_blank\">Search Mode</a> <br>\n                    - <a href=\"https://learn.microsoft.com/en-us/azure/search/search-query-simple-examples\"\
      \ target=\"_blank\">Search Mode Examples</a> <br>\n                    "
    choices:
    - name: Any
      value: any
    - name: All
      value: all
    default: full
    required: 0
  - name: scoring_profile
    depends_on:
      visible_when:
        field_name: search_query_type
        field_value: keyword,hybrid,vector,semantic
    type: text
    label: Scoring profile
    description: "\n                    Hiermee kun je een vooraf gedefinieerd scoreprofiel uit je index\
      \ toepassen.\n                    Scoringsprofielen worden gebruikt om de rangschikking van overeenkomende\
      \ documenten te verhogen op basis van criteria.\n                    <br><br>\n                \
      \    Meer info: <br>\n                    - <a href=\"https://learn.microsoft.com/en-us/azure/search/index-add-scoring-profiles\"\
      \ target=\"_blank\">Scoring Profile</a> <br>\n                    "
    default: default
    required: 0
  - name: scoring_statistics
    depends_on:
      visible_when:
        field_name: search_query_type
        field_value: keyword,hybrid,semantic,vector
    type: select
    label: Scoring statistics
    description: "\n                    Een waarde die aangeeft of we scoringsstatistieken (zoals documentfrequentie)\
      \ globaal willen berekenen voor consistentere scores, of lokaal, voor een lagere latentie.\n   \
      \                 De standaardwaarde is 'lokaal'. Gebruik 'globaal' om scoringsstatistieken globaal\
      \ te aggregeren voordat er gescoord wordt.\n                    Het gebruik van globale scoringsstatistieken\
      \ kan de latentie van zoekopdrachten verhogen.\n                    <br><br>\n\n               \
      \     <strong>Global</strong>: <br>\n                    De scorestatistieken worden globaal berekend\
      \ voor consistentere scores.\n                    <br><br>\n\n                    <strong>Local</strong>:\
      \ <br>\n                    De scorestatistieken worden lokaal berekend voor een lagere latentie.\n\
      \                    <br><br>\n\n                    Meer info: <br>\n                    - <a href=\"\
      https://learn.microsoft.com/en-us/python/api/azure-search-documents/azure.search.documents.models.scoringstatistics?view=azure-python\"\
      \ target=\"_blank\">Scoring Statistics</a> <br>\n\n                    "
    choices:
    - name: Global
      value: global
    - name: Local
      value: local
    default: local
  - name: vector_queries
    type: json
    label: Vector Queries
    description: "\n                    Maakt het mogelijk om vectorgebaseerde zoekopdrachten uit te voeren.\n\
      \n                    Dit veld bevat een JSON-object dat de vectorzoekopdracht specificeert.\n \
      \                   <br><br>\n                    Alle variabelen: <br>\n                    <strong>kind</strong>:\
      \ <br>\n                    Het soort vector query dat wordt uitgevoerd. Dit is een verplicht veld<br>\n\
      \                    &ensp; - \"<strong>text</strong>\": Vectorquery waarbij een tekstwaarde die\
      \ moet worden gevectoriseerd wordt opgegeven.<br>\n                    &ensp; - \"<strong>vector</strong>\"\
      : Vectorquery waarbij een onbewerkte vectorwaarde wordt opgegeven.<br>\n                    &ensp;\
      \ - \"<strong>imageUrl</strong>\": Vectorquery waarbij een URL die een afbeeldingswaarde vertegenwoordigt\
      \ die moet worden gevectoriseerd, wordt opgegeven.<br>\n                    &ensp; - \"<strong>imageBinary</strong>\"\
      : Vectorquery waarbij een met base 64 gecodeerd binair bestand van een afbeelding wordt opgegeven\
      \ die moet worden gevectoriseerd.\n                    <br><br>\n\n                    <strong>fields</strong>:\
      \ <br>\n                    Vectorvelden van het type Collection(Edm.Single) die moeten worden opgenomen\
      \ in de vector die wordt doorzocht.\n                    <br><br>\n\n                    <strong>k\
      \ (k_nearest_neighbors)</strong>: <br>\n                    Aantal dichtstbijzijnde buren dat als\
      \ belangrijkste treffers moet worden geretourneerd. Dit moet een geheel getal zijn.\n          \
      \          <br><br>\n\n                    <strong>weight</strong>: <br>\n                    Relatief\
      \ gewicht van de vectorquery in vergelijking met andere vectorquery's en/of de tekstquery binnen\
      \ dezelfde zoekaanvraag.\n                    Deze waarde wordt gebruikt bij het combineren van\
      \ de resultaten van meerdere classificatielijsten die worden geproduceerd door de verschillende\
      \ vectorquery's en/of de resultaten die zijn opgehaald via de tekstquery.\n                    Hoe\
      \ hoger het gewicht, hoe hoger de documenten die overeenkomen met die query, worden in de uiteindelijke\
      \ rangschikking geplaatst.\n                    De standaardwaarde is 1,0 en de waarde moet een\
      \ positief getal zijn dat groter is dan nul.\n                    <br><br>\n\n                 \
      \   <strong>exhaustive</strong>: <br>\n                    Wanneer \"True\", activeert u een uitgebreide\
      \ k-dichtstbijzijnde buurzoekopdracht voor alle vectoren binnen de vectorindex.\n              \
      \      Handig voor scenario's waarbij exacte overeenkomsten essentieel zijn, zoals het bepalen van\
      \ waarden voor de grondwaarheid.\n                    <br><br>\n\n                    Meer info:\
      \ <br>\n                    - <a href=\"https://learn.microsoft.com/en-us/python/api/azure-search-documents/azure.search.documents.models.vectorquery?view=azure-python\"\
      \ target=\"_blank\">Vector Queries</a> <br>\n\n                    "
    default: "{\n  \"kind\": \"text\",\n  \"fields\": \"vector\",\n  \"k\": 50,\n  \"weight\": 0.8,\n\
      \  \"exhaustive\": true\n}"
    depends_on:
      visible_when:
        field_name: search_query_type
        field_value: vector,hybrid,semantic
    required: 0
  - name: query_caption
    type: select
    label: Query Caption
    description: "\n                    Vraagt de zoekdienst om 'captions' (onderschriften) te genereren\
      \ voor de gevonden resultaten. Dit is alleen van toepassing op semantische zoekopdrachten.\n   \
      \                 <br><br>\n\n                    <strong>None</strong>: <br>\n                \
      \    Geen onderschriften genereren voor de zoekresultaten.\n                    <br><br>\n\n   \
      \                 <strong>Extractive</strong>: <br>\n                    Extraheert bijschriften\
      \ uit de overeenkomende documenten die passages bevatten die relevant zijn voor de zoekquery.\n\
      \                    <br><br>\n\n                    Meer info: <br>\n                    - <a href=\"\
      https://learn.microsoft.com/nl-nl/rest/api/searchservice/documents/search-post?view=rest-searchservice-2025-05-01-preview&tabs=HTTP#querycaptiontype\"\
      \ target=\"_blank\">Query Captions</a>\n                    "
    choices:
    - name: None
      value: none
    - name: Extractive
      value: extractive
    default: none
    depends_on:
      visible_when:
        field_name: search_query_type
        field_value: semantic
    required: 0
  - name: query_answer
    type: text
    label: Query Answer
    description: "\n                    Vraagt de zoekdienst om directe antwoorden op de query te proberen\
      \ te vinden.\n                    Deze parameter is alleen geldig als het querytype semantisch is.\n\
      \                    Als deze parameter is ingesteld, retourneert de query antwoorden die zijn geëxtraheerd\
      \ uit belangrijke passages in de hoogst gerangschikte documenten.\n                    Het aantal\
      \ antwoorden dat wordt geretourneerd kan worden geconfigureerd door het pijpteken | gevolgd door\
      \ de optie count-(aantal antwoorden) toe te voegen na de parameterwaarde answers, zoals extractive|count-3.\
      \ Standaard is count 1.\n                    De betrouwbaarheidsdrempel kan worden geconfigureerd\
      \ door het pijpteken | gevolgd door de optie count-(aantal antwoorden) toe te voegen na de parameterwaarde\
      \ answers, zoals extractive|count-3.\n                    Standaard is count 1. De vertrouwensdrempel\
      \ kan worden geconfigureerd door het buisteken | gevolgd door de optie threshold-(vertrouwensdrempel)\
      \ toe te voegen na de parameterwaarde answers, zoals extractive|threshold-0.9.\n               \
      \     De standaardwaarde voor threshold is 0.7. De standaarddrempel is 0,7.\n                  \
      \  <br><br>\n\n                    Meer info: <br>\n                    - <a href=\"https://learn.microsoft.com/en-us/python/api/azure-search-documents/azure.search.documents.models.queryanswertype?view=azure-python\"\
      \ target=\"_blank\">Query Answer</a> <br>\n\n                    "
    default: extractive|count-3
    depends_on:
      visible_when:
        field_name: search_query_type
        field_value: semantic
    required: 0
  layout:
  - id: tab-settings
    sections:
    - id: section-properties
      fields:
      - knowledge_sources
      - knowledge_source_input
      - replace_knowledge_sources
      - search_query
      - input_keys
      - output_key
    - id: section-search-settings
      fields:
      - enable_caching
      - search_query_type
      - enable_keyword_generation
      - keyword_generation_prompt_id
      - select
      - highlight_pre_tag
      - highlight_post_tag
      - highlight_chunks
      - minimum_relevancy_score
      - query_type
      - search_mode
      - query_caption
      - query_answer
      - scoring_profile
      - scoring_statistics
      - semantic_configuration_name
      - vector_queries

schema_version: 1
code: tribe
name: Tribe CRM
description: Read from or write to Tribe CRM using a stored OAuth2 or bearer token credential. Choose
  the operation to run a read-only query or a create/update request.
category: integrations
icon:
  static: /static/assets/media/brand-logos/tribe_logo.png
availability: general
stage: stable
runtime:
  execution_mode: stream
  trace: decorator
  manages_output_keys: false
  isolation: shared
  timeout_seconds: 300
capabilities: []
dependencies: []
io:
  input_data: {}
  output_data:
    result: The JSON response returned by the configured Tribe CRM request.
form:
  fields:
  - name: credential_code
    type: select
    label: Tribe Credential
    required: 1
    default: ''
    lookup:
      app_label: credentials
      model_name: Credential
      filter_operator: and
      filter:
        team: current_team_id
        is_active: true
        user__isnull: true
        credential_type__name__in:
        - tribeCrmOAuth2Api
        - tribeCrmBearerTokenApi
      field_value: code
      field_display: name
    help_text: Select a configured Tribe CRM credential. Both OAuth2 and static bearer token credentials
      are supported.
    choices: []
  - name: operation
    type: select
    label: Operation
    required: 1
    default: query
    choices:
    - name: Query (read-only GET)
      value: query
    - name: Write (create/update)
      value: write
    help_text: Choose 'Query' for a read-only GET request or 'Write' to create/update records with POST/PUT/PATCH.
  - name: request_path
    type: text
    label: Request Path
    required: 1
    default: ''
    max_length: 1000
    field_helpers:
    - helper_type: odataInspector
      placement: aside
      config:
        provider: tribe
        credential_field: credential_code
        query_params_field: query_params_json
    help_text: Relative Tribe API path, for example /contacts/{{ contact_id }} (query) or /Dossier({{
      dossier_id }}) (write). The configured credential base URL is prepended automatically.
  - name: query_params_json
    type: textarea
    label: Query Params JSON
    required: 0
    default: '{}'
    help_text: Optional JSON object with query parameters. Template variables such as {{ record_guid }}
      and Jinja control blocks such as {% if %} are supported.
  - name: http_method
    type: select
    label: HTTP Method
    required: 1
    default: POST
    depends_on:
      visible_when:
        field_name: operation
        field_value: write
    choices:
    - name: POST
      value: POST
    - name: PUT
      value: PUT
    - name: PATCH
      value: PATCH
    help_text: HTTP method used for write requests.
  - name: payload_json_template
    type: textarea
    label: Payload JSON Template
    required: 1
    default: '{}'
    depends_on:
      visible_when:
        field_name: operation
        field_value: write
    help_text: JSON body template rendered against accumulated input data. Template variables such as
      {{ relation_id }} are supported. Used for write requests.
  - name: response_json_path
    type: text
    label: Response JSON Path
    required: 0
    default: ''
    max_length: 500
    help_text: Optional dot-path to extract a nested part of the Tribe response. List indexes such as
      value.0.id are supported.
  - name: idempotency_key_template
    type: text
    label: Idempotency Key Template
    required: 0
    default: ''
    max_length: 500
    depends_on:
      visible_when:
        field_name: operation
        field_value: write
    help_text: Optional template value sent as the Idempotency-Key header for write requests.
  - name: output_key
    type: text
    label: Output Key
    required: 0
    default: ''
    max_length: 120
  layout:
  - id: tab-settings
    sections:
    - id: section-properties
      fields:
      - credential_code
      - operation
      - request_path
      - query_params_json
      - http_method
      - payload_json_template
      - response_json_path
      - idempotency_key_template
      - output_key

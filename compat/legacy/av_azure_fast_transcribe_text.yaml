    help_text: Kies één taal voor de beste nauwkeurigheid. Kies meerdere talen als Azure de gesproken
      taal moet herkennen.
    description: Azure gebruikt deze locales voor taalherkenning. Laat de selectie leeg voor onbeperkte
      meertalige detectie.
    attrs:
      data-searchable-multi-select: 'true'
      placeholder: Zoek op taal of locale, bijvoorbeeld Nederlands of nl-NL
      data-empty-label: Geen ondersteunde locales gevonden
      data-clear-label: Alles wissen
  - name: profanity_filter_mode
    type: select
    label: Profanity filtering
    required: 0
    default: None
    choices:
    - name: None
      value: None
    - name: Masked
      value: Masked
    - name: Removed
      value: Removed
    - name: Tags
      value: Tags
    help_text: None laat woorden ongewijzigd. Masked vervangt ze door sterretjes, Removed verwijdert ze
      en Tags voegt profanity-tags toe.
    description: Bepaalt hoe Azure herkende scheldwoorden in de transcriptie weergeeft.
  - name: enable_speaker_diarization
    type: checkbox
    label: Spreker diarization
    required: 0
    default: false
    depends_on:
      any:
      - field_name: enable_enhanced_mode
        field_value: false
      - field_name: enhanced_mode_task
        field_value: transcribe
  - name: max_number_of_speakers
    type: integer
    depends_on:
      visible_when:
        field_name: enable_speaker_diarization
        field_value: true
    label: Maximaal aantal sprekers
    required: 0
    default: 4
    max_value: 35
    min_value: 2
  - name: enable_timestamps
    type: checkbox
    label: Timinggegevens beschikbaar maken
    required: 0
    default: false
    help_text: Azure genereert timinggegevens standaard. Schakel dit in om de frase- en woorddetails als
      extra uitvoer beschikbaar te maken.
    description: De tekstuitvoer blijft ongewijzigd. De extra uitvoer gebruikt tijdstippen op de oorspronkelijke
      mediataaklijn.
  - name: timestamps_output_key
    type: text
    label: Label timinguitvoer
    required: 0
    default: timestamps
    max_length: 350
    depends_on:
      visible_when:
        field_name: enable_timestamps
        field_value: true
    help_text: Naam waaronder de gestructureerde timinggegevens worden opgeslagen, bijvoorbeeld timestamps.
    description: Deze sleutel moet verschillen van het label voor de gewone tekstuitvoer.
  - name: enable_phrase_list
    type: checkbox
    label: Phrase list gebruiken
    required: 0
    default: false
    depends_on:
      visible_when:
        field_name: enable_enhanced_mode
        field_value: false
    help_text: Verhoogt de herkenningskans van namen, locaties, vaktermen en afkortingen.
    description: Phrase lists zijn alleen beschikbaar in de standaard Fast-modus en niet in enhanced LLM
      Speech.
  - name: phrase_list_phrases
    type: textarea
    label: Phrases
    required: 0
    depends_on:
      visible_when:
        field_name: enable_phrase_list
        field_value: true
    help_text: Scheid termen met een nieuwe regel of puntkomma. Maximaal 500 termen.
    description: Dubbele exacte waarden worden één keer naar Azure gestuurd; de eerste volgorde blijft
      behouden.
    attrs:
      placeholder: Contoso; Gemeente Utrecht; Zaakgericht Werken
  - name: phrase_list_biasing_weight
    type: float
    label: Biasing weight
    required: 0
    default: 1.0
    min_value: 0.0
    max_value: 2.0
    depends_on:
      visible_when:
        field_name: enable_phrase_list
        field_value: true
    help_text: 0 schakelt beïnvloeding uit, 1 is de standaard en 2 geeft de sterkste voorkeur.
    description: Hogere waarden vergroten de voorkeur voor de opgegeven phrases en kunnen andere herkenning
      verdringen.
  - name: enable_enhanced_mode
    type: checkbox
    label: Enhanced LLM Speech gebruiken
    required: 0
    default: false
    help_text: Gebruikt Azure LLM Speech voor verbeterde transcriptie of vertaling. Beschikbaarheid kan
      per Azure-regio verschillen.
    description: Enhanced mode ondersteunt een prompt. Phrase lists zijn in deze modus niet toegestaan.
  - name: enhanced_mode_task
    type: select
    label: Enhanced taak
    required: 0
    default: transcribe
    choices:
    - name: transcribe
      value: transcribe
    - name: translate
      value: translate
    depends_on:
      visible_when:
        field_name: enable_enhanced_mode
        field_value: true
    help_text: Transcribe behoudt de gesproken taal. Translate vertaalt naar de gekozen doeltaal.
    description: Vertaling is niet combineerbaar met sprekerdiarization.
  - name: enhanced_mode_target_language
    type: select
    label: Doeltaal
    required: 0
    default: ''
    choices:
    - name: de
      value: de
    - name: en
      value: en
    - name: es
      value: es
    - name: fr
      value: fr
    - name: it
      value: it
    - name: ja
      value: ja
    - name: ko
      value: ko
    - name: pt
      value: pt
    - name: zh
      value: zh
    depends_on:
      visible_when:
        field_name: enhanced_mode_task
        field_value: translate
    help_text: Kies de taal waarin Azure de transcriptie moet vertalen.
    description: Azure enhanced translation ondersteunt uitsluitend de getoonde doeltalen.
  - name: enhanced_mode_prompt
    type: textarea
    label: Enhanced prompt
    required: 0
    default: ''
    max_length: 4096
    depends_on:
      visible_when:
        field_name: enable_enhanced_mode
        field_value: true
    help_text: Optionele instructie voor herkenning en uitvoerstijl. Bij voorkeur in het Engels. Maximaal
      4.096 tekens.
    description: De volledige tekst wordt als één prompt-item naar Azure gestuurd; nieuwe regels blijven
      behouden.
    attrs:
      placeholder: 'Bijvoorbeeld: Let extra op gemeentelijke namen en schrijf bedragen als cijfers.'
      data-show-character-count: 'true'
  - name: url
    type: text
    label: 'URL:'
    default: ''
    required: 0
    max_length: 350
    help_text: Gebruik een directe URL of een expressie zoals {{ variabele1 }}. Laat dit leeg om de bestaande
      input key-configuratie te gebruiken.
  - name: input_keys
    type: text
    label: 'Wat is het label van de invoer:'
    default: file
    required: 0
    max_length: 350
  - name: output_key
    type: text
    label: 'Label de uitvoer van deze vaardigheid alsvolgt:'
    default: text
    required: 0
    max_length: 350
  layout:
  - id: tab-settings
    sections:
    - id: section-properties
      fields:
      - locales
      - profanity_filter_mode
      - enable_speaker_diarization
      - max_number_of_speakers
      - enable_timestamps
      - timestamps_output_key
      - url
      - input_keys
      - output_key
    - id: section-advanced
      fields:
      - enable_phrase_list
      - phrase_list_phrases
      - phrase_list_biasing_weight
      - enable_enhanced_mode
      - enhanced_mode_task
      - enhanced_mode_target_language
      - enhanced_mode_prompt

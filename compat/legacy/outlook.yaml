# Legacy snapshot of the builtin node type 'outlook' (platform 1.62.5).
# Generated by scripts/plugins/dump_legacy_manifests.py. Do not edit:
# this is the compatibility baseline for a plugin with the same code.
schema_version: 1
code: outlook
name: Microsoft Outlook email (Graph API)
description: Send and receive emails via Microsoft Outlook using Graph API with OAuth2 authentication
category: integrations
icon:
  static: /static/assets/media/brand-logos/microsoft-5.svg
availability: general
stage: stable
runtime:
  execution_mode: stream
  trace: decorator
  manages_output_keys: false
  isolation: shared
  timeout_seconds: 300
capabilities: []
dependencies: []
io:
  input_data: {}
  output_data:
    result: The result of the Outlook operation (message data, send confirmation, etc.)
form:
  fields:
  - name: credential_code
    type: select
    label: Microsoft Outlook Credential
    required: 1
    default: ''
    lookup:
      app_label: credentials
      model_name: Credential
      filter_operator: and
      filter:
        team: current_team_id
        is_active: true
        user__isnull: true
      field_value: code
      field_display: name
    help_text: Select a configured Microsoft Outlook OAuth2 credential. Credentials can be managed from
      the admin under Credentials.
    choices: []
  - name: shared_mailbox_address
    type: text
    label: Shared Mailbox Address (optional)
    required: 0
    default: ''
    max_length: 500
    help_text: E-mailadres of User Principal Name van de shared mailbox. Laat leeg om de eigen mailbox
      van de geauthenticeerde gebruiker te gebruiken, of de shared mailbox die op de credential is ingesteld.
      Dit veld overschrijft de instelling op de credential.
  - name: operation
    type: select
    label: Operation
    required: 1
    default: send_message
    choices:
    - name: Send Email
      value: send_message
    - name: Get Messages
      value: get_messages
    - name: Reply to Message
      value: reply_message
    - name: Forward Message
      value: forward_message
    - name: Set Label (Category)
      value: set_label
    - name: Remove Label (Category)
      value: remove_label
    - name: Move Message
      value: move_message
  - name: to_recipients
    type: text
    label: To (comma-separated email addresses)
    required: 0
    default: ''
    max_length: 1000
    depends_on:
      visible_when:
        field_name: operation
        field_value: send_message,forward_message
  - name: cc_recipients
    type: text
    label: CC (comma-separated email addresses)
    required: 0
    default: ''
    max_length: 1000
    depends_on:
      visible_when:
        field_name: operation
        field_value: send_message,forward_message
  - name: bcc_recipients
    type: text
    label: BCC (comma-separated email addresses)
    required: 0
    default: ''
    max_length: 1000
    depends_on:
      visible_when:
        field_name: operation
        field_value: send_message,forward_message
  - name: subject
    type: text
    label: Subject
    required: 0
    default: ''
    max_length: 500
    depends_on:
      visible_when:
        field_name: operation
        field_value: send_message
  - name: body
    type: textarea
    label: Email Body
    required: 0
    default: ''
    help_text: Bij Send Email is dit de volledige body. Bij Reply to Message en Forward Message is dit
      de begeleidende tekst die boven het oorspronkelijke bericht wordt geplaatst; bij Forward blijven
      de originele body en bijlagen behouden.
    depends_on:
      visible_when:
        field_name: operation
        field_value: send_message,reply_message,forward_message
  - name: body_type
    type: select
    label: Body Type
    required: 0
    default: HTML
    choices:
    - name: HTML
      value: HTML
    - name: Text
      value: Text
    depends_on:
      visible_when:
        field_name: operation
        field_value: send_message,reply_message
  - name: folder_id
    type: text
    label: Mail Folder
    required: 0
    default: inbox
    max_length: 500
    help_text: 'Naam of pad van de mailmap. Bekende namen: inbox, sentitems, drafts, deleteditems, archive.
      Voor submappen gebruik je een pad, bijv. inbox/HR of inbox/HR/Sollicitaties. Een Graph API folder-ID
      wordt ook geaccepteerd.'
    depends_on:
      visible_when:
        field_name: operation
        field_value: get_messages
  - name: top
    type: text
    label: Number of messages to retrieve
    required: 0
    default: '10'
    max_length: 10
    depends_on:
      visible_when:
        field_name: operation
        field_value: get_messages
  - name: sort_order
    type: select
    label: Sorteervolgorde
    required: 0
    default: oldest_first
    choices:
    - name: Oudste eerst
      value: oldest_first
    - name: Nieuwste eerst
      value: newest_first
    help_text: Bepaalt de volgorde waarin berichten worden opgehaald.
    depends_on:
      visible_when:
        field_name: operation
        field_value: get_messages
  - name: exclude_categories
    type: text
    label: Categorieën uitsluiten (kommagescheiden)
    required: 0
    default: ''
    max_length: 500
    help_text: 'Berichten met één van deze categorieën worden uitgesloten. Voorbeeld: AI Processing, AI
      Processed'
    depends_on:
      visible_when:
        field_name: operation
        field_value: get_messages
  - name: filter
    type: text
    label: OData filter (optional)
    required: 0
    default: ''
    max_length: 500
    help_text: E.g., isRead eq false
    depends_on:
      visible_when:
        field_name: operation
        field_value: get_messages
  - name: body_content_type
    type: select
    label: Body Content Type
    required: 0
    default: html
    choices:
    - name: HTML
      value: html
    - name: Text
      value: text
    help_text: Kies of de body als HTML of als platte tekst opgehaald moet worden.
    depends_on:
      visible_when:
        field_name: operation
        field_value: get_messages
  - name: include_inline_attachments
    type: checkbox
    label: Ingesloten bestanden naar bijlages omzetten
    required: 0
    default: false
    help_text: Wanneer ingeschakeld worden ingesloten (embedded) afbeeldingen ook als bijlage geüpload
      naar blob storage.
    depends_on:
      visible_when:
        field_name: operation
        field_value: get_messages
  - name: mark_as_read
    type: checkbox
    label: Berichten markeren als gelezen
    required: 0
    default: false
    help_text: Wanneer ingeschakeld worden alle opgehaalde berichten automatisch als gelezen gemarkeerd
      in Outlook.
    depends_on:
      visible_when:
        field_name: operation
        field_value: get_messages
  - name: message_id
    type: text
    label: Message ID
    required: 0
    default: ''
    max_length: 500
    depends_on:
      visible_when:
        field_name: operation
        field_value: reply_message,forward_message,set_label,remove_label,move_message
  - name: destination_folder
    type: text
    label: Doelmap
    required: 0
    default: ''
    max_length: 500
    help_text: 'Naam of pad van de doelmap waarnaar het bericht verplaatst wordt. Bekende namen: inbox,
      sentitems, drafts, deleteditems, archive. Voor submappen gebruik je een pad, bijv. inbox/HR of inbox/HR/Sollicitaties.
      Een Graph API folder-ID wordt ook geaccepteerd.'
    depends_on:
      visible_when:
        field_name: operation
        field_value: move_message
  - name: categories
    type: text
    label: Categories (comma-separated)
    required: 0
    default: ''
    max_length: 1000
    help_text: 'Eén of meer Outlook-categorieën, gescheiden door komma''s. Bij Set Label worden deze toegevoegd
      bovenop bestaande categorieën. Bij Remove Label worden deze categorieën verwijderd. Voorbeeld: Urgent,
      Follow-up'
    depends_on:
      visible_when:
        field_name: operation
        field_value: set_label,remove_label
  - name: input_keys
    type: text
    label: Input Key(s) for template variables (comma-separated)
    default: ''
    required: 0
    max_length: 350
    help_text: Variables from previous skills to use in email body template
  - name: output_key
    type: text
    label: Output Key
    default: outlook_result
    required: 0
    max_length: 100
  layout:
  - id: tab-authentication
    label: Authentication
    sections:
    - id: section-credential
      label: Microsoft Outlook Credential
      fields:
      - credential_code
      - shared_mailbox_address
  - id: tab-settings
    label: Settings
    sections:
    - id: section-operation
      label: Operation
      fields:
      - operation
      - to_recipients
      - cc_recipients
      - bcc_recipients
      - subject
      - body
      - body_type
      - folder_id
      - top
      - sort_order
      - exclude_categories
      - filter
      - body_content_type
      - message_id
      - include_inline_attachments
      - mark_as_read
      - categories
      - destination_folder
  - id: tab-io
    label: Input/Output
    sections:
    - id: section-io
      fields:
      - input_keys
      - output_key

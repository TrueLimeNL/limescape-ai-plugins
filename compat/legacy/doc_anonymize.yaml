schema_version: 1
code: doc_anonymize
name: Anonymize document
description: Lakt (anonimiseert) gevoelige gegevens in PDF- en Word-documenten met Woo-artikellabels en
  ondersteunt handmatige arceervlakken voor PDF.
category: documents
icon:
  lucide: shield
availability: general
stage: stable
runtime:
  execution_mode: stream
  trace: decorator
  manages_output_keys: false
  isolation: shared
  timeout_seconds: 300
capabilities: []
dependencies: []
io:
  input_data: {}
  output_data:
    document_link: De URL van het gelakte document
form:
  fields:
  - name: url
    label: URL
    type: text
    required: 0
    default: ''
    description: Gebruik een directe URL of een expressie zoals {{ file }}. Laat dit leeg om de eerste
      legacy input key te blijven gebruiken.
    max_length: 350
  - name: data
    label: Data
    type: textarea
    required: 0
    default: ''
    description: Gebruik een expressie zoals {{ sensitive_data }} of lever direct JSON/string data aan.
      Ondersteunt tekstitems en voor PDF ook handmatige area-items met position.boundingRect/rects. Laat
      dit leeg om de tweede legacy input key te blijven gebruiken.
  - name: input_keys
    label: Input Key(s) (komma-gescheiden)
    type: text
    required: 1
    default: file,sensitive_data
    description: Legacy fallback. De eerste key verwijst naar de document URL en de tweede key naar de
      gevoelige data wanneer url/data leeg zijn.
    max_length: 350
  - name: output_key
    label: Output sleutel
    type: text
    required: 1
    default: document_link
    max_length: 350
  - name: mode
    label: Modus (definitief / concept)
    type: text
    required: 0
    default: definitief
    description: '''definitief'' lakt de tekst onleesbaar zwart (standaard). ''concept'' zet een gekleurd
      kader om de tekst (leesbaar) met een kleur per Woo-artikel en een legenda-voorpagina, zodat een
      zienswijzer kan beoordelen wat er gelakt gaat worden. Gebruik bv. {{ mode }} om dit per aanroep
      te bepalen.'
    max_length: 20
  - name: article_colors
    label: Concept-legenda (kleuren per Woo-artikel)
    type: textarea
    required: 0
    default: ''
    description: 'Optioneel, alleen voor ''concept''. JSON om de legenda/kleuren/labels aan te passen

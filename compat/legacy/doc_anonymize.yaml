      groen, overig grijs). Vorm: {"title": "...", "intro": ["regel1", "regel2"], "default": {"color":
      "6C757D", "label": "Zonder artikel"}, "articles": {"5.1.2a": {"color": "D62828", "label": "Persoonsgegevens"},
      "5.1.2e": "1D4ED8"}}. Overrides breiden de standaardset uit / overschrijven hem.'
  layout:

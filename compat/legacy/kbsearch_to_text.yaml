schema_version: 1
code: kbsearch_to_text
name: Convert search result to text
description: use a prompt to generate text based on Knowledge base search results
category: knowledge
icon:
  lucide: search
availability: general
stage: stable
runtime:
  execution_mode: stream
  trace: llm
  manages_output_keys: false
  isolation: shared
  timeout_seconds: 300
capabilities: []
dependencies: []
io:
  input_data: {}
  output_data:
    text: The generated text based on the input text and prompt
form:
  fields:
  - name: prompt_id
    type: select
    multi_select: false
    label: System prompt
    required: 1
    default: ''
    lookup:
      app_label: prompt_manager
      model_name: Prompt
      filter_operator: or
      filter:
        team: current_team_id
        team_id: 'null'
      field_value: prompt_id
      field_display: prompt_name
    quick_link_enabled: true
    choices: []
  - name: ai_provider_and_model
    type: select
    label: AI provider and model
    default: AOAI_SE_0128#gpt-4o
    lookup:
      app_label: ai_platform_shared
      model_name: LookupListItem
      filter:
        lkuplitm_cat: ai_provider_and_model
      field_value: lkuplitm_value
      field_display: lkuplitm_display_name
    choices: []
  - name: model_temperature
    type: float
    label: Model temperature 0-2
    required: 0
  - name: model_top_p
    type: float
    label: Model topP 0-1
    required: 0
  - name: max_output_tokens
    type: integer
    label: Max output tokens
    default: 16384
    required: 0
  - name: reasoning
    type: select
    label: Reasoning effort
    default: ''
    required: 0
    choices:
    - name: Standaard - provider default
      value: ''
    - name: Geen - reasoning uitgeschakeld
      value: none
    - name: Minimal - minimale reasoning
      value: minimal
    - name: Low - snel, weinig denkstappen
      value: low
    - name: Medium - balans
      value: medium
    - name: High - diepere analyse
      value: high
    - name: XHigh - maximale reasoning (langzamer, duurder)
      value: xhigh
  - name: input_keys
    type: text
    label: 'Wat is het label van de invoer (meerdere mogelijk middels komma-scheiding):'
    default: search_results
    required: 0
    max_length: 350
  - name: search_results_variable
    type: text
    label: 'Zoek resultaten (variabele referentie vanuit de flow, bijv. {{ search_output }}):'
    default: ''
    required: 0
    max_length: 350
  - name: output_key
    type: text
    label: 'Label de uitvoer van deze vaardigheid alsvolgt:'
    default: text
    required: 0
    max_length: 350
  - name: top_n_results_summary
    type: integer
    label: Aantal zoekresultaten dat moet worden gebruikt voor het genereren van de samenvatting
    default: 5
    required: 0
  - name: enable_caching
    type: checkbox
    default: true
    label: Cache de resultaat (de generate tekst)
    required: 0
  layout:

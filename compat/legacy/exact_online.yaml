schema_version: 1
code: exact_online
name: Exact Online
description: Haal Exact Online accounts op of maak een inkoopboeking/verkoopfactuur aan in Exact Online.
category: integrations
icon:
  static: /static/assets/media/brand-logos/exact_logo.png
availability: general
stage: stable
runtime:
  execution_mode: stream
  trace: decorator
  manages_output_keys: false
  isolation: shared
  timeout_seconds: 300
capabilities: []
dependencies: []
io:
  input_data:
    team_id: Team context gebruikt voor de geselecteerde Exact Online credential.
  output_data:
    exact_online_relations: Lijst met Exact Online relaties inclusief BTW-nummer, IBAN, KvK en e-mailadres.
    exact_online_classifications: Lijst met Exact Online accountclassificaties inclusief code en omschrijving.
    exact_online_gl_accounts: Lijst met grootboekrekeningen uit Exact Online inclusief code en omschrijving.
    exact_online_items: Lijst met verkoopartikelen uit Exact Online die gebruikt kunnen worden in SalesInvoiceLines.Item.
    exact_online_vat_codes: Lijst met Exact Online btw-codes inclusief type, percentage, transactie-type
      en gekoppelde btw-grootboekrekeningen.
    exact_online_journals: Lijst met Exact Online dagboeken inclusief code, type, valuta, bankgegevens,
      betaalprovider en gekoppelde grootboekrekening.
    exact_online_cost_centers: Lijst met Exact Online kostenplaatsen inclusief code en omschrijving.
    exact_online_cost_units: Lijst met Exact Online kostendragers (cost units) inclusief code en omschrijving.
    exact_online_cost_unit_results: Exact Online ReportingBalance-gegevens voor kostendragers, inclusief
      ruwe regels en een overzicht per kostendrager met omzet, kosten, resultaat en resultaatpercentage.
    exact_online_purchase_entries: Lijst met Exact Online inkoopboekingen inclusief factuur- en referentievelden.
    exact_online_sales_invoices: Lijst met Exact Online verkoopfacturen inclusief status, bedragen en
      optioneel regels.
    exact_online_documents: Lijst met Exact Online documenten die aan een account (relatie) gekoppeld
      zijn.
    exact_online_cost_unit: Aangemaakte Exact Online kostendrager (cost unit).
    exact_online_document: Aangemaakt Exact Online document met metadata voor verdere koppelingen of bijlagen.
    exact_online_document_attachment: Aangemaakte Exact Online documentbijlage met documentkoppeling en
      bestandsmetadata.
    exact_online_purchase_entry: Aangemaakte Exact Online inkoopboeking via purchaseentry/PurchaseEntries.
    exact_online_sales_invoice: Aangemaakte Exact Online verkoopfactuur via salesinvoice/SalesInvoices.
    exact_online_printed_sales_invoice: Resultaat van het printen of mailen van een Exact Online verkoopfactuur
      via PrintedSalesInvoices.
form:

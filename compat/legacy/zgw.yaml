schema_version: 1
code: zgw
name: ZGW Koppeling
description: Bevraaag of schrijf naar ZGW-conforme API's (Zaken, Catalogi, Documenten). Gebruikt kortlevende
  JWT-authenticatie conform de VNG ZGW-standaard. Ondersteunt bij 'Document aanmaken en koppelen' naast
  de standaard (Open Zaak) ook de Octopus-variant met omgekeerde call-volgorde.
category: integrations
icon:
  lucide: braces
availability: general
stage: stable
runtime:
  execution_mode: stream
  trace: decorator
  manages_output_keys: false
  isolation: shared
  timeout_seconds: 300
capabilities: []
dependencies: []
io:
  input_data:
    team_id: Team context voor de geselecteerde ZGW credential.
  output_data:
    zgw_zaken: Lijst met zaken opgehaald via de Zaken API.
    zgw_zaak: Detail van een enkele zaak inclusief statussen.
    zgw_created_zaak: Nieuw aangemaakte zaak.
    zgw_status: Aangemaakte status op een zaak.
    zgw_zaaktypen: Lijst met zaaktypen uit de Catalogi API.
    zgw_documenten: Lijst met documenten gekoppeld aan een zaak of geselecteerd via document-id(s).
    zgw_created_document: Nieuw aangemaakt document inclusief zaakinformatieobject.
    zgw_updated_document: Bijgewerkt document (nieuwe versie na lock/patch/unlock).
    zgw_informatieobjecttypen: Lijst met informatieobjecttypen uit de Catalogi API.
    zgw_statustypen: Lijst met statustypen voor een zaaktype uit de Catalogi API.
    zgw_resultaattypen: Lijst met resultaattypen voor een zaaktype uit de Catalogi API.
    zgw_besluittypen: Lijst met besluittypen uit de Catalogi API.
    zgw_created_resultaat: Nieuw aangemaakt resultaat op een zaak.
    zgw_created_besluit: Nieuw aangemaakt besluit via de Besluiten API.
form:
  fields:
  - name: credential_code
    type: select
    label: ZGW API Credential
    required: 1
    default: ''
    lookup:
      app_label: credentials
      model_name: Credential
      filter_operator: and
      filter:
        team: current_team_id
        is_active: true
        user__isnull: true
        credential_type__name__in:
        - zgwJwtApi
      field_value: code
      field_display: name
    help_text: Selecteer een geconfigureerde ZGW API credential (client_id + client_secret).
    choices: []
  - name: default_zaaktype_url
    type: select
    label: Standaard Zaaktype URL
    required: 0
    default: ''
    max_length: 500
    lookup:
      app_label: zgw
      model_name: Zaaktype
      field_value: url
      field_display: omschrijving
      filter:
        credential_code: credential_code
        max_pages: 5
    choices: []
    help_text: Volledig URL van het zaaktype (bijv. https://catalogi.gemeente.nl/api/v1/zaaktypen/abc).
      Wordt gebruikt als standaard filter voor type-discovery operaties, bepaalt het documenttype-filter
      bij 'Documenten ophalen bij zaak' en de documenttype-keuzes bij 'Document aanmaken en koppelen'.
      Laat leeg voor ongefilterd ophalen.
    depends_on:
      visible_when:
        field_name: operation
        field_value_in:
        - get_documenten
        - get_informatieobjecttypen
        - get_statustypen
        - get_resultaattypen
        - get_besluittypen
        - create_document
  - name: operation
    type: select
    label: Operatie
    required: 1
    default: get_zaken
    choices:
    - name: Zaken ophalen
      value: get_zaken
    - name: Zaak detail ophalen
      value: get_zaak_detail
    - name: Zaak aanmaken
      value: create_zaak
    - name: Status op zaak zetten
      value: update_zaak_status
    - name: Resultaat op zaak zetten
      value: create_resultaat
    - name: Zaaktypen ophalen
      value: get_zaaktypen
    - name: Informatieobjecttypen ophalen
      value: get_informatieobjecttypen
    - name: Statustypen ophalen
      value: get_statustypen
    - name: Resultaattypen ophalen
      value: get_resultaattypen
    - name: Besluittypen ophalen
      value: get_besluittypen
    - name: Documenten ophalen bij zaak
      value: get_documenten
    - name: Document aanmaken en koppelen
      value: create_document
    - name: Document bijwerken (inhoud vervangen)
      value: update_document
    - name: Documentversies ophalen (historie)
      value: get_document_versions
    - name: Besluit aanmaken
      value: create_besluit
  - name: zaaktype_url
    type: select
    label: Zaaktype URL (filter)
    required: 0

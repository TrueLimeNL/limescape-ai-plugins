schema_version: 1
code: document_to_blob
name: Document uploaden naar Blob Storage
description: Download een document vanaf een bron-URL (optioneel afgeschermd via een credential, zoals
  ZGW JWT) en upload het naar Azure Blob Storage. Geeft een tijdelijke SAS-URL terug.
category: documents
icon:
  lucide: circle-help
availability: general
stage: stable
runtime:
  execution_mode: stream
  trace: decorator
  manages_output_keys: false
  isolation: shared
  timeout_seconds: 300
capabilities: []
dependencies: []
io:
  input_data:
    team_id: Team-context voor blob-padscoping en credential-resolutie.
  output_data:
    document_link: SAS-URL van het geüploade document in blob storage.
    filename: De bestandsnaam waaronder het document is opgeslagen.
form:
  fields:
  - name: source_url
    type: text
    label: Bron-URL van het document
    required: 1
    default: ''
    max_length: 2000
    help_text: De URL waarvandaan het document wordt opgehaald. Gebruik {{ key }} om de URL uit een vorige
      stap te halen.
  - name: credential_code
    type: select
    label: Credential voor beveiligde bron (optioneel)
    required: 0
    default: ''
    lookup:
      app_label: credentials
      model_name: Credential
      filter_operator: and
      filter:
        team: current_team_id
        is_active: true
        user__isnull: true
        credential_type__name__in:
        - zgwJwtApi
      field_value: code
      field_display: name
    choices: []
    help_text: 'Optioneel: kies een credential wanneer de bron-URL is afgeschermd (bv. ZGW-documenten).
      Laat leeg voor een publiek toegankelijke URL.'
  - name: filename
    type: text
    label: Bestandsnaam (optioneel)
    required: 0
    default: ''
    max_length: 350
    help_text: 'Optioneel: de naam waaronder het document wordt opgeslagen. Leeg laten leidt de naam af
      uit de response of URL.'
  - name: private_container
    type: checkbox
    label: Opslaan in privé-container
    required: 0
    default: true
  - name: valid_for_hours
    type: text
    label: Geldigheidsduur van de SAS-URL (uren)
    required: 0
    default: '24'
    max_length: 10
  - name: output_key
    type: text
    label: 'Label de uitvoer van deze vaardigheid alsvolgt:'
    required: 0
    default: document_link
    max_length: 350
  layout:
  - id: tab-settings
    label: Instellingen
    sections:
    - id: section-properties
      fields:
      - source_url
      - credential_code
      - filename
      - private_container
      - valid_for_hours
      - output_key

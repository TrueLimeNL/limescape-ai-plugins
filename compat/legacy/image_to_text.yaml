# Legacy snapshot of the builtin node type 'image_to_text' (platform 1.62.5).
# Generated by scripts/plugins/dump_legacy_manifests.py. Do not edit:
# this is the compatibility baseline for a plugin with the same code.
schema_version: 1
code: image_to_text
name: Describe image(s) as text
description: Process one or multiple images using AI vision models to generate a text description
category: documents
icon:
  static: /static/assets/media/file-types/image.svg
availability: general
stage: stable
runtime:
  execution_mode: stream
  trace: llm
  manages_output_keys: false
  isolation: shared
  timeout_seconds: 300
capabilities: []
dependencies: []
io:
  input_data: {}
  output_data:
    text: The generated text description based on the input image(s) and prompt
form:
  fields:
  - name: prompt_id
    type: select
    multi_select: false
    label: System prompt
    required: 0
    default: ''
    lookup:
      app_label: prompt_manager
      model_name: Prompt
      filter_operator: or
      filter:
        team: current_team_id
        team_id: 'null'
      field_value: prompt_id
      field_display: prompt_name
    quick_link_enabled: true
    choices: []
  - name: ai_provider_and_model
    type: select
    label: AI provider and model
    default: AOAI_SE_0128#gpt-4o
    lookup:
      app_label: ai_platform_shared
      model_name: LookupListItem
      filter:
        lkuplitm_cat: ai_provider_and_model
      field_value: lkuplitm_value
      field_display: lkuplitm_display_name
    choices: []
  - name: allowed_mime_types
    type: select
    multi_select: true
    label: Toegestane afbeeldingsformaten
    required: 0
    default:
    - image/jpeg
    - image/png
    - image/gif
    - image/webp
    - image/bmp
    choices:
    - value: image/jpeg
      name: JPEG (image/jpeg)
    - value: image/png
      name: PNG (image/png)
    - value: image/gif
      name: GIF (image/gif)
    - value: image/webp
      name: WebP (image/webp)
    - value: image/bmp
      name: BMP (image/bmp)
  - name: detail_level
    type: select
    label: Detailniveau analyse
    default: auto
    choices:
    - value: auto
      name: Automatisch (auto)
    - value: low
      name: Laag (low) - sneller, minder tokens
    - value: high
      name: Hoog (high) - gedetailleerder, meer tokens
  - name: min_image_size_kb
    type: float
    label: Minimale bestandsgrootte per afbeelding (KB)
    required: 0
    default: 0
    min_value: 0
    help_text: Afbeeldingen kleiner dan dit worden overgeslagen (bijv. voor het negeren van logo's). 0
      = geen minimum.
  - name: max_image_size_mb
    type: float
    label: Maximale bestandsgrootte per afbeelding (MB)
    required: 0
    default: 20.0
    min_value: 0.1
  - name: model_temperature
    type: float
    label: Model temperature 0-2
    required: 0
    min_value: 0.0
    max_value: 2.0
  - name: model_top_p
    type: float
    label: Model topP 0-1
    required: 0
    min_value: 0.0
    max_value: 1.0
  - name: model_max_output_tokens
    type: integer
    label: Max output tokens
    default: 4096
    required: 0
  - name: reasoning
    type: select
    label: Reasoning effort
    default: ''
    required: 0
    choices:
    - name: Standaard - provider default
      value: ''
    - name: Geen - reasoning uitgeschakeld
      value: none
    - name: Minimal - minimale reasoning
      value: minimal
    - name: Low - snel, weinig denkstappen
      value: low
    - name: Medium - balans
      value: medium
    - name: High - diepere analyse
      value: high
    - name: XHigh - maximale reasoning (langzamer, duurder)
      value: xhigh
  - name: urls
    type: text
    label: 'URL(s):'
    default: ''
    required: 0
    max_length: 350
    help_text: Gebruik een directe URL of een expressie zoals {{ variabele1 }}. De expressie mag resolven
      naar één URL of een lijst met URLs. Laat dit leeg om de bestaande input key-configuratie te gebruiken.
  - name: input_keys
    type: text
    label: 'Invoerlabel (legacy):'
    default: image_files
    required: 0
    max_length: 350
    help_text: Legacy fallback voor skill-configuraties die nog een input key gebruiken, zoals 'image_files',
      'files', 'images' of 'file'. Voor nodes gebruik je bij voorkeur het veld URL(s).
  - name: source_auth_mode
    type: select
    label: Bron-authenticatie
    required: 0
    default: none
    choices:
    - name: Geen
      value: none
    - name: Bearer token uit flow-parameter
      value: bearer
    - name: Bearer token via Django admin credential
      value: bearer_credential
    help_text: Gebruik dit alleen voor beveiligde image URLs. Publieke URLs hebben geen bron-authenticatie
      nodig.
  - name: source_auth_token
    type: password
    label: Bron-auth token
    required: 0
    default: ''
    max_length: 4000
    depends_on:
      visible_when:
        field_name: source_auth_mode
        field_value: bearer
    help_text: Bearer token voor beveiligde bron-URLs. Runtime-expressies zoals {{ tribe_token }} worden
      ondersteund.
  - name: source_auth_credential_code
    type: select
    label: Bron-auth credential
    required: 0
    default: ''
    depends_on:
      visible_when:
        field_name: source_auth_mode
        field_value: bearer_credential
    lookup:
      app_label: credentials
      model_name: Credential
      filter_operator: and
      filter:
        team: current_team_id
        is_active: true
        user__isnull: true
        credential_type__name__in:
        - tribeCrmOAuth2Api
        - tribeCrmBearerTokenApi
      field_value: code
      field_display: name
    choices: []
    help_text: 'Selecteer een Django credential voor beveiligde image URLs. Eerste ondersteunde provider
      in deze skill: Tribe OAuth2/bearer.'
  - name: output_key
    type: text
    label: 'Label de uitvoer van deze vaardigheid alsvolgt:'
    default: text
    required: 0
    max_length: 350
  layout:
  - id: tab-settings
    sections:
    - id: section-properties
      fields:
      - prompt_id
      - urls
      - input_keys
      - source_auth_mode
      - source_auth_token
      - source_auth_credential_code
      - output_key
  - id: tab-image-settings
    sections:
    - id: section-validation
      fields:
      - allowed_mime_types
      - min_image_size_kb
      - max_image_size_mb
      - detail_level
  - id: tab-advanced
    sections:
    - id: section-model
      fields:
      - ai_provider_and_model
      - model_temperature
      - model_top_p
      - model_max_output_tokens
      - reasoning

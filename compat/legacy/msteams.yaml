# Legacy snapshot of the builtin node type 'msteams' (platform 1.62.5).
# Generated by scripts/plugins/dump_legacy_manifests.py. Do not edit:
# this is the compatibility baseline for a plugin with the same code.
schema_version: 1
code: msteams
name: Microsoft Teams
description: Send messages to Microsoft Teams chats and channels and manage native Teams approvals using
  Graph API with OAuth2 authentication
category: integrations
icon:
  static: /static/assets/media/brand-logos/ms-teams.png
availability: general
stage: stable
runtime:
  execution_mode: stream
  trace: none
  manages_output_keys: false
  isolation: shared
  timeout_seconds: 300
capabilities: []
dependencies: []
io:
  input_data: {}
  output_data:
    result: The result of the Teams operation (send confirmation, message id, web url)
form:
  fields:
  - name: credential_code
    type: select
    label: Microsoft Teams Credential
    required: 1
    default: ''
    lookup:
      app_label: credentials
      model_name: Credential
      filter_operator: and
      filter:
        team: current_team_id
        is_active: true
        user__isnull: true
        credential_type__name__in:
        - microsoftTeamsOAuth2Api
      field_value: code
      field_display: name
    help_text: Select a configured Microsoft Teams OAuth2 credential. Credentials can be managed from
      the admin under Credentials.
    choices: []
  - name: operation
    type: select
    label: Operation
    required: 1
    default: send_chat_message
    choices:
    - name: Send Chat Message
      value: send_chat_message
    - name: Send Channel Message
      value: send_channel_message
    - name: Create Approval
      value: create_approval
    - name: Get Approval Status
      value: get_approval
  - name: chat_id
    type: combobox
    label: Chat
    required: 0
    default: ''
    max_length: 500
    lookup:
      app_label: msteams
      model_name: Chat
      field_value: id
      field_display: topic
      filter:
        credential_code: credential_code
    choices: []
    help_text: Kies een chat uit de lijst (geladen op basis van de geselecteerde credential) of vul zelf
      een chat-ID in, bijv. 19:2da4c29f6d7041eca70b638b43d45437@thread.v2.
    depends_on:
      visible_when:
        field_name: operation
        field_value: send_chat_message
  - name: teams_team_id
    type: combobox
    label: Team
    required: 0
    default: ''
    max_length: 500
    lookup:
      app_label: msteams
      model_name: Team
      field_value: id
      field_display: displayName
      filter:
        credential_code: credential_code
    choices: []
    help_text: Kies een Microsoft Teams-team uit de lijst (geladen op basis van de geselecteerde credential)
      of vul zelf een team-ID (groeps-ID) in.
    depends_on:
      visible_when:
        field_name: operation
        field_value: send_channel_message
  - name: channel_id
    type: combobox
    label: Channel
    required: 0
    default: ''
    max_length: 500
    lookup:
      app_label: msteams
      model_name: Channel
      field_value: id
      field_display: displayName
      filter:
        credential_code: credential_code
        teams_team_id: teams_team_id
    choices: []
    help_text: Kies een kanaal uit de lijst (geladen nadat een team is geselecteerd) of vul zelf een kanaal-ID
      in, bijv. 19:xxxxxxxx@thread.tacv2.
    depends_on:
      visible_when:
        field_name: operation
        field_value: send_channel_message
  - name: subject
    type: text
    label: Subject (optional)
    required: 0
    default: ''
    max_length: 500
    help_text: Optioneel onderwerp boven het kanaalbericht.
    depends_on:
      visible_when:
        field_name: operation
        field_value: send_channel_message
  - name: reply_to_message_id
    type: text
    label: Reply to Message ID (optional)
    required: 0
    default: ''
    max_length: 500
    help_text: Laat leeg om een nieuw bericht in het kanaal te plaatsen. Vul het ID van een bestaand kanaalbericht
      in om in die thread te antwoorden.
    depends_on:
      visible_when:
        field_name: operation
        field_value: send_channel_message
  - name: message
    type: textarea
    label: Message
    required: 0
    default: ''
    help_text: De inhoud van het bericht. Ondersteunt template-variabelen zoals {{ variable }} uit eerdere
      skills.
    depends_on:
      visible_when:
        field_name: operation
        field_value: send_chat_message,send_channel_message
  - name: content_type
    type: select
    label: Content Type
    required: 0
    default: text
    choices:
    - name: Text
      value: text
    - name: HTML
      value: html
    depends_on:
      visible_when:
        field_name: operation
        field_value: send_chat_message,send_channel_message
  - name: approval_title
    type: text
    label: Approval Title
    required: 0
    default: ''
    max_length: 500
    help_text: Titel van het goedkeuringsverzoek. Ondersteunt template-variabelen zoals {{ variable }}.
    depends_on:
      visible_when:
        field_name: operation
        field_value: create_approval
  - name: approval_description
    type: textarea
    label: Approval Description
    required: 0
    default: ''
    help_text: Toelichting bij het goedkeuringsverzoek. Ondersteunt template-variabelen.
    depends_on:
      visible_when:
        field_name: operation
        field_value: create_approval
  - name: approvers
    type: text
    label: Approvers (comma-separated e-mail addresses)
    required: 0
    default: ''
    max_length: 1000
    help_text: Eén of meer goedkeurders, gescheiden door komma's. E-mailadressen (UPN) of Azure AD user-ID's.
      Goedkeurders krijgen het verzoek in de Teams Approvals-app.
    depends_on:
      visible_when:
        field_name: operation
        field_value: create_approval
  - name: approval_await_all
    type: checkbox
    label: Alle goedkeurders moeten reageren
    required: 0
    default: false
    help_text: Wanneer ingeschakeld is het verzoek pas afgerond als alle goedkeurders gereageerd hebben.
      Anders is één reactie voldoende.
    depends_on:
      visible_when:
        field_name: operation
        field_value: create_approval
  - name: allow_email_notification
    type: checkbox
    label: E-mailnotificatie versturen
    required: 0
    default: true
    help_text: Goedkeurders ontvangen naast de Teams-notificatie ook een e-mail.
    depends_on:
      visible_when:
        field_name: operation
        field_value: create_approval
  - name: approval_id
    type: text
    label: Approval ID
    required: 0
    default: ''
    max_length: 500
    help_text: 'Het ID van het goedkeuringsverzoek, bijv. uit een eerdere Create Approval-stap: {{ msteams_result.approval_id
      }}. State wordt ''completed'' zodra er beslist is; result bevat dan ''Approved'' of ''Rejected''.'
    depends_on:
      visible_when:
        field_name: operation
        field_value: get_approval
  - name: input_keys
    type: text
    label: Input Key(s) for template variables (comma-separated)
    default: ''
    required: 0
    max_length: 350
    help_text: Variables from previous skills to use in message template
  - name: output_key
    type: text
    label: Output Key
    default: msteams_result
    required: 0
    max_length: 100
  layout:
  - id: tab-authentication
    label: Authentication
    sections:
    - id: section-credential
      label: Microsoft Teams Credential
      fields:
      - credential_code
  - id: tab-settings
    label: Settings
    sections:
    - id: section-operation
      label: Operation
      fields:
      - operation
      - chat_id
      - teams_team_id
      - channel_id
      - reply_to_message_id
      - subject
      - message
      - content_type
      - approval_title
      - approval_description
      - approvers
      - approval_await_all
      - allow_email_notification
      - approval_id
  - id: tab-io
    label: Input/Output
    sections:
    - id: section-io
      fields:
      - input_keys
      - output_key

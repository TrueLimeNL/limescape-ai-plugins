# Legacy snapshot of the builtin node type 'pdf_to_searchable_pdf' (platform 1.62.5).
# Generated by scripts/plugins/dump_legacy_manifests.py. Do not edit:
# this is the compatibility baseline for a plugin with the same code.
schema_version: 1
code: pdf_to_searchable_pdf
name: Convert PDF to searchable PDF
description: Voegt een zichtbare en doorzoekbare OCR-tekstlaag toe aan een PDF en levert een download-URL
  op.
category: documents
icon:
  static: /static/assets/media/file-types/pdf.svg
availability: general
stage: stable
runtime:
  execution_mode: stream
  trace: decorator
  manages_output_keys: false
  isolation: shared
  timeout_seconds: 300
capabilities: []
dependencies: []
io:
  input_data: {}
  output_data:
    document_link: De URL van de searchable PDF
    extracted_text_pages: Een geordende array met per pagina het paginanummer en de geëxtraheerde tekst
form:
  fields:
  - name: url
    label: URL
    type: text
    required: 0
    default: ''
    description: Gebruik een directe URL of een expressie zoals {{ file }}. Laat dit leeg om de eerste
      legacy input key te blijven gebruiken.
    max_length: 350
  - name: input_keys
    label: Input Key(s) (komma-gescheiden)
    type: text
    required: 1
    default: file
    description: Legacy fallback. De eerste key verwijst naar de PDF URL of het lokale pad wanneer url
      leeg is.
    max_length: 350
  - name: output_key
    label: Output sleutel
    type: text
    required: 1
    default: document_link
    description: Naam van het output veld waarin de download-URL van de searchable PDF wordt opgeslagen.
    max_length: 350
  - name: ocr_language
    label: OCR taal
    type: text
    required: 0
    default: nld+eng
    description: Tesseract taalstring, bijvoorbeeld nld+eng voor gecombineerde OCR.
    max_length: 100
  - name: image_density
    label: OCR image density
    type: integer
    required: 0
    default: 220
    description: DPI voor PDF-rendering tijdens OCR-overlay. Hoger geeft doorgaans betere OCR maar kost
      meer tijd.
  - name: pages_to_convert
    label: Pagina's om te converteren
    type: text
    required: 0
    default: ''
    description: Geef een pagina-nummer of JSON-lijst van pagina-nummers op, bijvoorbeeld 3 of [1,2,5].
    max_length: 200
  - name: min_confidence
    label: Minimale OCR confidence
    type: integer
    required: 0
    default: 0
    description: Optionele confidence-drempel. Voor Tesseract gebruik je de normale 0-100 schaal. Voor
      LiteParse kun je ook percentage-invoer zoals 1, 20 of 35 gebruiken; die wordt omgerekend naar 0.01,
      0.20 en 0.35. Gebruik 0 om niets uit te filteren.
  - name: force_ocr_all_pages
    label: Force OCR all pages
    type: checkbox
    required: 0
    default: false
    description: Voer OCR-overlay ook uit op pagina's die al een bruikbare tekstlaag lijken te hebben.
  - name: use_liteparse
    label: Use LiteParse
    type: checkbox
    required: 0
    default: true
    description: Gebruik LiteParse als primaire layoutbron. Schakel dit uit om alleen Tesseract te gebruiken;
      wanneer LiteParse niet beschikbaar is valt hij automatisch terug op Tesseract.
  - name: liteparse_ocr_server_url
    label: LiteParse OCR server URL
    type: text
    required: 0
    default: ''
    description: Optionele OCR server URL voor LiteParse.
    max_length: 350
  - name: liteparse_ocr_warmup_url
    label: LiteParse OCR warmup URL
    type: text
    required: 0
    default: ''
    description: Optioneel endpoint om de OCR-server vooraf te pingen. Laat leeg om de LiteParse OCR server
      URL te gebruiken.
    max_length: 350
  - name: liteparse_ocr_language
    label: LiteParse OCR taal
    type: text
    required: 0
    default: nld
    description: OCR taalcode voor LiteParse, bijvoorbeeld nld of eng.
    max_length: 100
  layout:
  - id: tab-settings
    sections:
    - id: section-properties
      fields:
      - url
      - input_keys
      - output_key
      - ocr_language
      - image_density
      - pages_to_convert
      - min_confidence
      - force_ocr_all_pages
      - use_liteparse
      - liteparse_ocr_server_url
      - liteparse_ocr_warmup_url
      - liteparse_ocr_language
